# ==========================================================
# Coordinator Service — Configuración
# ==========================================================
# Equivalente al antiguo config/replicas.properties pero en formato YAML
# de Spring Boot. Para desplegar en la red real, cambiar 127.0.0.1 por
# las IPs reales de cada PC.
# ==========================================================

server:
  port: 7000

quorum:
  n: 3
  w: 2
  r: 2
  nodes:
    - id: 1
      host: 127.0.0.1
      port: 6001
    - id: 2
      host: 127.0.0.1
      port: 6002
    - id: 3
      host: 127.0.0.1
      port: 6003

socket:
  timeout-ms: 2500

heartbeat:
  interval-ms: 1500

circuit-breaker:
  fail-threshold: 3
  cooldown-ms: 10000

ai:
  enabled: true
  ollama-url: http://localhost:11434/api/generate
  model: qwen2.5-coder:3b
  timeout-ms: 15000
  consult-interval-ms: 10000

logging:
  level:
    com.quorum: INFO
